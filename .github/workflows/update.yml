---
name: Update pins
on:
  schedule:
    # Run every ~12 hours
    - cron: 0 */12 * * *
  workflow_dispatch:  # Allow manual triggering
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = pipe-operators
      - name: Update pins.lock.json
        run: |
          nix run --accept-flake-config github:manic-systems/tack materialize
          nix run --accept-flake-config github:manic-systems/tack update
      - name: Diff
        id: diff
        run: |
          if git diff --quiet .tack/pins.lock.json; then
            echo "Nothing ever happens."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "SOMETHING HAPPENED"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload pins
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pins
          path: |
            .tack/pins.lock.json
            .tack/pins.toml
            .tack/patches/*
  check:
    needs: update
    if: needs.update.outputs.changed == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Download pins
        uses: actions/download-artifact@v8
        with:
          name: pins
          path: .tack
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = pipe-operators
      - name: Check
        run: |
          tree -a
          nix flake check --print-build-logs
  commit:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Download pins.lock.json
        uses: actions/download-artifact@v8
        with:
          name: pins
          path: .tack
      - name: Commit, PR, Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git switch --create "update-inputs-${{ github.run_id }}-${{ github.run_attempt }}"
          git add .tack
          git commit --message "Updated inputs"
          git push origin HEAD
          { echo '```diff'; git diff HEAD^ -- .tack/pins.lock.json; echo '```'; } \
          | gh pr create --title "Update tack inputs" --body-file -
          gh pr merge --rebase --delete-branch || { gh pr close --delete-branch; exit 1; }

---
on:
  workflow_dispatch:
  push:
    branches: [main]
name: Dead code analysis
jobs:
  deadnix:
    name: Deadnix
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: deadnix
      - uses: astro/deadnix-action@main

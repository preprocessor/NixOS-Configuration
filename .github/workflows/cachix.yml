name: Build and Cache Specific Nix Packages
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  prepare-matrix:
    name: Check Cache
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'tack: update inputs')
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = pipe-operators
      - name: Filter uncached packages
        id: set-matrix
        run: |
          PACKAGES=($(nix run .#list-remote-packages))
          MISSING=()
          for pkg in "${PACKAGES[@]}"; do
            if STORE_PATH=$(nix eval --raw ".#packages.x86_64-linux.$pkg.outPath"); then
              if ! nix path-info --store https://bazinga.cachix.org "$STORE_PATH" >/dev/null 2>&1; then
                MISSING+=("$pkg")
              fi
            else
              echo "::error::Evaluation failed for package: $pkg"
              exit 1
            fi
          done
          if [ ${#MISSING[@]} -eq 0 ]; then
            echo "All packages are cached."
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
          else
            JSON_ARRAY="$(printf '%s\n' "${MISSING[@]}" | jq -R . | jq -s -c .)"
            echo "matrix=$JSON_ARRAY" >> "$GITHUB_OUTPUT"
          fi
  build-packages:
    name: Build ${{ matrix.package }}
    needs: prepare-matrix
    if: >-
      needs.prepare-matrix.result == 'success' &&
      needs.prepare-matrix.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = pipe-operators
      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: bazinga
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Build and push ${{ matrix.package }}
        run: |-
          nix build ".#packages.x86_64-linux.${{ matrix.package }}" \
            --print-out-paths --print-build-logs \
            | cachix push bazinga
      - name: Record Build Status
        if: always()
        run: echo "${{ job.status }}" > "status-${{ matrix.package }}.txt"
      - name: Upload Build Status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: status-${{ matrix.package }}
          path: status-${{ matrix.package }}.txt
          retention-days: 1
  notify:
    name: Notify Discord
    needs: build-packages
    if: always() && needs.build-packages.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Statuses
        uses: actions/download-artifact@v8
        with:
          pattern: status-*
          merge-multiple: true
      - name: Create Summary
        id: summary
        run: |
          echo "description<<EOF" >> "$GITHUB_OUTPUT"
          for file in status-*.txt; do
            [ -e "$file" ] || continue
            PACKAGE="${file#status-}"
            PACKAGE="${PACKAGE%.txt}"
            if [ "$(cat "$file")" = "success" ]; then
              echo "✅ $PACKAGE" >> "$GITHUB_OUTPUT"
            else
              echo "❌ $PACKAGE" >> "$GITHUB_OUTPUT"
            fi
          done
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Notify Discord
        uses: sarisia/actions-status-discord@v1.16.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          username: GitHub Workflow
          avatar_url: ${{ secrets.AVATAR_URL }}
          status: ${{ needs.build-packages.result }}
          title: Build and cache packages
          description: ${{ steps.summary.outputs.description }}
          content: look at this shi ${{ secrets.DISCORD_USER}}
          notimestamp: true

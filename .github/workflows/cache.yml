---
name: Build and Cache Specific Nix Packages
on:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_run:
    workflows: [Update pins]
    types: [completed]
jobs:
  prepare-matrix:
    name: Check Cache
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_run' ||
      startsWith(github.event.head_commit.message, 'tack: update inputs')
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = pipe-operators
            extra-substituters = ${{ vars.CACHE_SUBSTITUTER }}
            extra-trusted-public-keys = ${{ vars.CACHE_PUBLIC_KEY }}
      - name: Materialize tack patches
        run: nix run .#packages.x86_64-linux.tack -- materialize
      - name: Filter uncached packages
        id: set-matrix
        env:
          CACHE_URL: ${{ vars.CACHE_SUBSTITUTER }}
        run: |
          matrix=$(bash .github/scripts/missing-packages.sh)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  build-packages:
    name: Build ${{ matrix.package }}
    needs: prepare-matrix
    if: >-
      needs.prepare-matrix.result == 'success' &&
      needs.prepare-matrix.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = pipe-operators
            extra-substituters = ${{ vars.CACHE_SUBSTITUTER }}
            extra-trusted-public-keys = ${{ vars.CACHE_PUBLIC_KEY }}
      - name: Materialize tack patches
        run: nix run .#packages.x86_64-linux.tack -- materialize
      - name: Install Attic client
        run: nix profile install nixpkgs#attic-client
      - name: Build and push ${{ matrix.package }}
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          CACHE_API_ENDPOINT: ${{ vars.CACHE_API_ENDPOINT }}
        run: |
          BUILD_OUT=$(nix build ".#packages.x86_64-linux.${{ matrix.package }}" --print-build-logs --no-link --print-out-paths)
          mapfile -t OUT <<<"$BUILD_OUT"
          attic login local "$CACHE_API_ENDPOINT" "$ATTIC_TOKEN"
          attic push main "${OUT[@]}"
      - name: Record Build Status
        if: always()
        run: echo "${{ job.status }}" > "status-${{ matrix.package }}.txt"
      - name: Upload Build Status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: status-${{ matrix.package }}
          path: status-${{ matrix.package }}.txt
          retention-days: 1
  notify:
    name: Notify Discord
    needs: build-packages
    if: always() && needs.build-packages.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Statuses
        uses: actions/download-artifact@v8
        with:
          pattern: status-*
          merge-multiple: true
      - name: Create Summary
        id: summary
        run: |
          echo "description<<EOF" >> "$GITHUB_OUTPUT"
          for file in status-*.txt; do
            [ -e "$file" ] || continue
            PACKAGE="${file#status-}"
            PACKAGE="${PACKAGE%.txt}"
            if [ "$(cat "$file")" = "success" ]; then
              echo "✅ $PACKAGE" >> "$GITHUB_OUTPUT"
            else
              echo "❌ $PACKAGE" >> "$GITHUB_OUTPUT"
            fi
          done
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Notify Discord
        uses: sarisia/actions-status-discord@v1.16.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          username: GitHub Workflow
          avatar_url: ${{ secrets.AVATAR_URL }}
          status: ${{ needs.build-packages.result }}
          title: Build and cache packages
          description: ${{ steps.summary.outputs.description }}
          content: look at this shi ${{ secrets.DISCORD_USER}}
          notimestamp: true

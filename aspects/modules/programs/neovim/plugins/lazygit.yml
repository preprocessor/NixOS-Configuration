---
customCommands:
  # Files: show the selected file in diffview.
  - key: e
    context: files
    description: Open file diff in Diffview
    command: >-
      nvim --server "$NVIM" --remote-expr
      "v:lua.LazyDiff('-- {{.SelectedFile.Name}}')"

  # Commits: show the selected commit as a diff.
  - key: e
    context: commits
    description: Open commit diff in Diffview
    command: >-
      nvim --server "$NVIM" --remote-expr
      "v:lua.LazyDiff('{{.SelectedCommit.Hash}}^!')"

  # Sub-commits (e.g. after entering a branch's commit list).
  - key: e
    context: subCommits
    description: Open commit diff in Diffview
    command: >-
      nvim --server "$NVIM" --remote-expr
      "v:lua.LazyDiff('{{.SelectedCommit.Hash}}^!')"

  # Local branches: compare HEAD against the selected branch.
  - key: e
    context: localBranches
    description: Open branch diff in Diffview
    command: >-
      nvim --server "$NVIM" --remote-expr
      "v:lua.LazyDiff('HEAD...{{.SelectedLocalBranch.Name}}')"
git:
  autoFetch: false
  diffRenderers:
    - command: delta --file-style "#c8b0e8" --features space-separated --light --diff-highlight
        --true-color always --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
        --line-fill-method=ansi --navigate --keep-plus-minus-markers --commit-style="#b8db8c"
    - command: delta --side-by-side --file-style "#c8b0e8" --features space-separated
        --light --diff-highlight --true-color always --paging=never --line-numbers
        --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
        --line-fill-method=ansi --navigate --keep-plus-minus-markers --commit-style="#b8db8c"
  overrideGpg: true
  update:
    days: 365
    method: never
gui:
  border: single
  portraitMode: never
  branchLogGraph: style
  expandFocusedSidePanel: true
  expandedSidePanelWeight: 2
  filterMode: fuzzy
  showBottomLine: false
  showBranchCommitHash: true
  showCommandLog: false
  showFileTree: true
  showNumstatInFilesView: true
  showPanelJumps: false
  showRandomTip: false
  sidePanelWidth: 1
  sidePanels:
    -   - files
        - worktrees
        - submodules
    -   - branches
        - remotes
        - tags
    -   - commits
        - reflog
        - stash
  theme:
    activeBorderColor: ['#c5c0ff']
    authorColors:
      '*': '#a8c8f0'
    cherryPickedCommitBgColor: ['#313245']
    cherryPickedCommitFgColor: ['#c5c0ff']
    defaultFgColor: ['#cfd3e7']
    inactiveBorderColor: ['#4D415F']
    optionsTextColor: ['#8c92aa']
    searchingActiveBorderColor: ['#f6d88a']
    selectedLineBgColor: ['#313245']
    selectedLineFgColor: [bold]
    unstagedChangesColor: ['#f4a8b8']
keybinding:
  universal:
    focusMainView: '4'
    jumpToBlock: ['1', '2', '3']

[all_follow]
flake-utils = "flake-utils"
nixpkgs = "nixpkgs"
rust-overlay = "rust-overlay"
systems = "systems"

[omit_inputs]
names = ["flake-compat","pre-commit-hooks","treefmt-nix"]

[shorturls]
applefont = "https://devimages-cdn.apple.com/design/resources/download/{path}.dmg"
gh = "github:{path}"
nixpkgs = "github:NixOS/nixpkgs/nixpkgs-{path}"

[inputs.amane]
url = "github:MystiaFin/amane"

[inputs.bat-syntax-justfile]
url = "gh:nk9/just_sublime"
frozen = true
group = "tui"
type = "fetch"

[inputs.cade]
url = "github:manic-systems/cade"

[inputs.chicago-font]
url = "gh:nikdog/chicago-font"
frozen = true
group = "fonts"
type = "fetch"

[inputs.cliphist-src]
url = "gh:sentriz/cliphist"
group = "cliphist"
type = "fetch"

[inputs.cliphist-tui-src]
url = "gh:SHORiN-KiWATA/cliphist-tui"
group = "cliphist"
type = "fetch"

[inputs.extra-metadata]
url = "gh:boydaihungst/file-extra-metadata.yazi"
group = "yazi"
type = "fetch"

[inputs.fish-completion-sync]
url = "gh:iynaix/fish-completion-sync"
